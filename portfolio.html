<!DOCTYPE html>
<html>
  <head>
    <title>My Page</title>
    <style>
      /* --- CSS SECTION --- */
      body {
        background-image: url("https://shared.steamstatic.com/community_assets/images/items/1256670/6ba85d55f76c7e9324d0589d8b11277f7d4bd0e1.jpg");
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        background-size: cover;
        font-family: Georgia, sans-serif;
      }

      h1 {
        color: #d4e1e8;
        text-align: center;
        background-color: #000000;
        padding: 8px;
      }

      h2 {
        color: #d4e1e8;
      }

      p {
        color: #a2becd;
        font-size: 16px;
      }

      ul {
        color: #a2becd;
      }

      .highlight {
        background-color: #000000;
        padding: 15px;
      }

      .chara {
        background-color: rgba(250, 250, 250, 0.25);
        padding: 10px;
      }

      .middle {
        vertical-align: middle;
      }

      .image-container {
        position: relative;
        display: inline-block;
        width: 75px;
        height: auto;
      }

      .image-container img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .image-container .hover-img {
        opacity: 0;
      }

      .image-container .default-img {
        opacity: 1;
      }

      .image-container:hover .hover-img {
        opacity: 1;
      }

      .image-container:hover .default-img {
        opacity: 0;
      }

      .image-wrapper {
        width: 75px;
        height: 75px;
        display: inline-block;
      }

      .botan {
        display: inline-block;
        background-color: #ffef23;
        color: #1e2e2d;
        padding: 10px 10px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }

      .botan:hover {
        background-color: #fff570;
      }

      .cover {
        opacity: 1;
      }

      .cover:hover {
        opacity: 0.75;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 177px;
      }
      .square {
        width: 200px;
        height: 200px;
        object-fit: cover;
      }
      .bold-text {
        font-weight: bold;
      }

    </style>
  </head>
